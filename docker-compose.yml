services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: suhail
      POSTGRES_PASSWORD: password456
      POSTGRES_DB: ai_chat_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: "pg_isready -U suhail -d ai_chat_db"
      interval: 3s
      timeout: 3s
      retries: 5

  backend:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - OLLAMA_HOST=http://127.0.0.1:11434
      - DATABASE_URL=postgresql://suhail:password456@db:5432/ai_chat_db
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: