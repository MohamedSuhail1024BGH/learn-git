name: FastAPI Automated Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  run-test:
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: suhail
          POSTGRES_PASSWORD: password456
          POSTGRES_DB: ai_chat_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 1. Checkout respository code
        uses: actions/checkout@v5

      - name: 2. Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: 3. Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4. Run pytest suite
        env:
          DATABASE_URL: postgresql://suhail:password456@localhost:5432/ai_chat_db
        run: pytest -v